<g class="l0"><text x="16" y="54" fill="#7ee787">$</text><text x="32.8" y="54" fill="#f0f6fc" textLength="126.0">cat escrow.yaml</text><rect class="c0" x="32.8" y="40" width="134.4" height="19" fill="#0d1117"/></g>
<text class="l1" x="16" y="73" fill="#c9d1d9" textLength="42.0" xml:space="preserve">jobs:</text>
<text class="l2" x="16" y="92" fill="#c9d1d9" textLength="201.6" xml:space="preserve">  - name: nightly-backup</text>
<text class="l3" x="16" y="111" fill="#c9d1d9" textLength="142.8" xml:space="preserve">    interval: 26h</text>
<text class="l4" x="16" y="130" fill="#c9d1d9" textLength="168.0" xml:space="preserve">  - name: cert-renew</text>
<text class="l5" x="16" y="149" fill="#c9d1d9" textLength="134.4" xml:space="preserve">    interval: 8d</text>
<text class="l6" x="16" y="168" fill="#c9d1d9" textLength="193.2" xml:space="preserve">  - name: weekly-report</text>
<text class="l7" x="16" y="187" fill="#c9d1d9" textLength="134.4" xml:space="preserve">    interval: 8d</text>
<g class="l9"><text x="16" y="225" fill="#7ee787">$</text><text x="32.8" y="225" fill="#f0f6fc" textLength="336.0">escrow run nightly-backup -- ./backup.sh</text><rect class="c9" x="32.8" y="211" width="344.4" height="19" fill="#0d1117"/></g>
<text class="l10" x="16" y="244" fill="#c9d1d9" textLength="285.6" xml:space="preserve">backup written: db-2026-10-16.dump</text>
