<text class="l13" x="16" y="301" fill="#7ee787" textLength="546.0" xml:space="preserve">[OK] &#x27;nightly-backup&#x27; last pinged 2s ago, within its 26h interval</text>
<text class="l14" x="16" y="320" fill="#7ee787" textLength="504.0" xml:space="preserve">[OK] &#x27;cert-renew&#x27; last pinged 0s ago, within its 8d interval</text>
<text class="l15" x="16" y="339" fill="#e3b341" textLength="739.2" xml:space="preserve">[??] &#x27;weekly-report&#x27; has never pinged in -- it may have never run, or is pinging under a</text>
