name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test the floor, not just today.
        python: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python tests/test_duration.py
      - run: python tests/test_config.py
      - run: python tests/test_state.py
      - run: python tests/test_check.py
      - run: python tests/test_cli.py
      - run: python tests/test_serve.py

  package:
    # Build and install the distribution on every commit, not only at release --
    # a packaging break (missing package data, wrong entry point, PyYAML not
    # actually resolving) is invisible to `pip install -e .` and only shows
    # up in the wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel and run it as a user would
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --disable-pip-version-check -q dist/*.whl
          /tmp/v/bin/escrow ping nightly-backup --state /tmp/state.json
          printf 'jobs:\n  - name: nightly-backup\n    interval: 26h\n' > /tmp/escrow.yaml
          /tmp/v/bin/escrow check /tmp/escrow.yaml --state /tmp/state.json
          test "$(/tmp/v/bin/python -c 'import escrow; print(escrow.__version__)')" \
             = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
